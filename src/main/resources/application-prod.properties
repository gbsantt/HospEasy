spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
app.cors.origins=${CORS_ORIGINS}
# Terminate TLS at a trusted reverse proxy or configure server.ssl.* explicitly.
# Do not expose the internal HTTP listener directly on the internet.
server.error.include-message=never
server.error.include-stacktrace=never

recovery.secret=${RECOVERY_SECRET}
spring.flyway.baseline-on-migrate=${DB_BASELINE:false}
